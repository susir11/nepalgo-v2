server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://api-gateway:8080;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;           # receipt / destination image uploads
  }

  # Destination photos when catalog's S3_PUBLIC_URL_BASE is the relative /media/destination-images
  # (gateway route -> image store). Read-only; keys are unique per upload, so cache hard.
  location /media/ {
    include /etc/nginx/snippets/security-headers.conf;
    limit_except GET HEAD { deny all; }
    proxy_pass http://api-gateway:8080;
    expires 30d;
  }

  # Hashed assets can be cached forever; index.html never (so deploys show up immediately).
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
