server:
  port: 8082

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5433/nepalgo
    username: catalog_svc
    password: catalog_dev_pw
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: catalog
    default-schema: catalog
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

nepalgo:
  jwt:
    staff:
      public-key-path: ${JWT_STAFF_PUBLIC_KEY_PATH}
  weather:
    api-key: ${OPENWEATHERMAP_API_KEY}
    cache-ttl-minutes: 45
  storage:
    endpoint: http://localhost:9000
    access-key: ${RUSTFS_ACCESS_KEY}
    secret-key: ${RUSTFS_SECRET_KEY}
    bucket: destination-images
    public-url-base: http://localhost:9000/destination-images

resilience4j:
  circuitbreaker:
    instances:
      weatherApi:
        # Opens the circuit if 50% of the last 10 calls failed — stops
        # hammering a struggling external API and fails fast instead,
        # same principle as a payment gateway suspending a corridor that's
        # erroring instead of letting every transaction time out slowly.
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      weatherApi:
        timeout-duration: 5s