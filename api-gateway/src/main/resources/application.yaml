server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # discovery-locator off: we define routes explicitly below instead of
          # letting the gateway auto-generate a route per registered service.
          # Auto-routing is convenient but leaks every service's raw name as a
          # public path — explicit routes are the SWIFT-routing-table equivalent:
          # nothing reaches a backend unless we've deliberately wired a path to it.
          discovery:
            locator:
              enabled: false
          # CORS for LOCAL DEVELOPMENT only: the Flutter web build runs on its own
          # random localhost port and calls the gateway directly. Phase 9 replaces
          # this with the real app/admin domains (never "*" in production).
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "http://localhost:[*],http://127.0.0.1:[*]"
                allowed-methods: GET,POST,PUT,DELETE,OPTIONS
                allowed-headers: "*"
                exposed-headers: Content-Disposition
                max-age: 3600
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/admin/auth/**,/api/v1/admin/staff/**,/api/v1/admin/customers/**
            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/api/destinations/**,/api/admin/destinations/**
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**,/api/admin/bookings/**,/api/admin/feature-flags/booking,/api/reviews/**,/api/admin/reviews/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/bills/**,/api/store-credits/**,/api/admin/bills/**,/api/admin/receipts/**,/api/admin/fx-rates/**,/api/admin/billing-settings/**,/api/admin/store-credits/**,/api/admin/refund-requests/**,/api/admin/feature-flags/payment
            - id: legal-service
              uri: lb://legal-service
              predicates:
                - Path=/api/legal/**,/api/content/**,/api/admin/legal/**,/api/admin/content/**,/privacy,/terms,/delete-account
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**,/api/admin/notifications/**
            - id: support-service
              uri: lb://support-service
              predicates:
                - Path=/api/support/**,/api/support-status,/api/admin/support/**,/api/admin/feature-flags/support
            # NOTE: /internal/** is deliberately NOT routed. Service-to-service
            # endpoints are reachable only inside the network (Eureka), never
            # from the internet through the gateway: defence in depth on top of
            # the X-Internal-Api-Key check.

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway