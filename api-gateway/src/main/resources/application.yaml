server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # discovery-locator off: we define routes explicitly below instead of
          # letting the gateway auto-generate a route per registered service.
          # Auto-routing is convenient but leaks every service's raw name as a
          # public path — explicit routes are the SWIFT-routing-table equivalent:
          # nothing reaches a backend unless we've deliberately wired a path to it.
          discovery:
            locator:
              enabled: false
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/admin/auth/**,/api/v1/admin/staff/**
            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/api/destinations/**,/api/admin/destinations/**
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**,/api/admin/bookings/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/bills/**,/api/store-credits/**,/api/admin/bills/**,/api/admin/receipts/**,/api/admin/fx-rates/**,/api/admin/billing-settings/**,/api/admin/store-credits/**,/api/admin/refund-requests/**
            - id: legal-service
              uri: lb://legal-service
              predicates:
                - Path=/api/legal/**,/api/content/**,/api/admin/legal/**,/api/admin/content/**
            # NOTE: /internal/** is deliberately NOT routed. Service-to-service
            # endpoints are reachable only inside the network (Eureka), never
            # from the internet through the gateway: defence in depth on top of
            # the X-Internal-Api-Key check.

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway