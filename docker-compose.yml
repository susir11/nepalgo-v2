# Project name prefixes every container/volume/network with "nepalgo",
# so this stack can never collide with Mero Remit's.
name: nepalgo

# Shared by every application service below (YAML anchor).
x-common-env: &common-env
  EUREKA_URL: http://eureka-server:8761/eureka
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}        # empty -> the container refuses to start (entrypoint check)
  JWT_STAFF_PUBLIC_KEY_PATH: /app/secrets/staff-public.pem
  JWT_CUSTOMER_PUBLIC_KEY_PATH: /app/secrets/customer-public.pem

services:
  postgres:
    image: postgres:17            # pin the exact minor after Step 1 verification
    container_name: nepalgo-postgres
    environment:
      POSTGRES_DB: nepalgo
      POSTGRES_USER: nepalgo_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"               # host 5433 -> container 5432 (5432 is likely taken by Mero Remit)
    volumes:
      - nepalgo-pgdata:/var/lib/postgresql/data
      # Scripts here run ONCE, when the data volume is first created.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nepalgo_admin -d nepalgo"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [nepalgo-net]

  pgadmin:
    image: dpage/pgadmin4:latest  # temporary: pin the exact tag once you confirm the version
    container_name: nepalgo-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - nepalgo-pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks: [nepalgo-net]

  rustfs:
    image: rustfs/rustfs:1.0.0   # pinned to the GA release, not :latest
    container_name: nepalgo-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - nepalgo-rustfs-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://127.0.0.1:9000/health" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ nepalgo-net ]

  # Dev-only fake SMTP server (Phase 8). notification-service sends mail to
  # localhost:1025; nothing ever leaves the machine. Read the inbox at
  # http://localhost:8025. Production uses a real provider (Phase 9).
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: nepalgo-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox
    networks: [ nepalgo-net ]

  # ---------------------------------------------------------------- the application
  # Production-like local run of every service (each service's Dockerfile, prod
  # profile, secrets mounted read-only). Off by default (profile "app"):
  #   1) rebuild all JARs first:  build-all.ps1
  #   2) start:                   docker compose --profile app up -d --build
  # Only gateway (8080), Eureka (8761) and the admin UI (8090) are published;
  # services talk on the private network, exactly like in production.
  eureka-server:
    build: ./eureka-server
    image: nepalgo/eureka-server:local
    container_name: nepalgo-eureka-server
    profiles: ["app"]
    mem_limit: 320m
    ports: [ "8761:8761" ]
    networks: [ nepalgo-net ]

  api-gateway:
    build: ./api-gateway
    image: nepalgo/api-gateway:local
    container_name: nepalgo-api-gateway
    profiles: ["app"]
    environment:
      <<: *common-env
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:[*]}
    volumes: [ "./secrets:/app/secrets:ro" ]
    depends_on: [ eureka-server ]
    mem_limit: 420m
    networks: [ nepalgo-net ]
    ports: [ "8080:8080" ]

  auth-service:
    build: ./auth-service
    image: nepalgo/auth-service:local
    container_name: nepalgo-auth-service
    profiles: ["app"]
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/nepalgo
      DB_USERNAME: auth_svc
      DB_PASSWORD: ${AUTH_SVC_DB_PASSWORD:-auth_dev_pw}
      JWT_STAFF_PRIVATE_KEY_PATH: /app/secrets/staff-private.pem
      JWT_CUSTOMER_PRIVATE_KEY_PATH: /app/secrets/customer-private.pem
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/firebase-service-account.json
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
    volumes: [ "./secrets:/app/secrets:ro" ]
    depends_on: [ postgres, eureka-server ]
    mem_limit: 420m
    networks: [ nepalgo-net ]

  catalog-service:
    build: ./catalog-service
    image: nepalgo/catalog-service:local
    container_name: nepalgo-catalog-service
    profiles: ["app"]
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/nepalgo
      DB_USERNAME: catalog_svc
      DB_PASSWORD: ${CATALOG_SVC_DB_PASSWORD:-catalog_dev_pw}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_URL_BASE: http://localhost:9000/destination-images
    volumes: [ "./secrets:/app/secrets:ro" ]
    depends_on: [ postgres, eureka-server, rustfs ]
    mem_limit: 420m
    networks: [ nepalgo-net ]

  booking-service:
    build: ./booking-service
    image: nepalgo/booking-service:local
    container_name: nepalgo-booking-service
    profiles: ["app"]
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/nepalgo
      DB_USERNAME: booking_svc
      DB_PASSWORD: ${BOOKING_SVC_DB_PASSWORD:-booking_dev_pw}
    volumes: [ "./secrets:/app/secrets:ro" ]
    depends_on: [ postgres, eureka-server ]
    mem_limit: 420m
    networks: [ nepalgo-net ]

  payment-service:
    build: ./payment-service
    image: nepalgo/payment-service:local
    container_name: nepalgo-payment-service
    profiles: ["app"]
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/nepalgo
      DB_USERNAME: payment_svc
      DB_PASSWORD: ${PAYMENT_SVC_DB_PASSWORD:-payment_dev_pw}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      S3_ENDPOINT: http://rustfs:9000
    volumes: [ "./secrets:/app/secrets:ro" ]
    depends_on: [ postgres, eureka-server, rustfs ]
    mem_limit: 420m
    networks: [ nepalgo-net ]

  legal-service:
    build: ./legal-service
    image: nepalgo/legal-service:local
    container_name: nepalgo-legal-service
    profiles: ["app"]
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/nepalgo
      DB_USERNAME: legal_svc
      DB_PASSWORD: ${LEGAL_SVC_DB_PASSWORD:-legal_dev_pw}
    volumes: [ "./secrets:/app/secrets:ro" ]
    depends_on: [ postgres, eureka-server ]
    mem_limit: 420m
    networks: [ nepalgo-net ]

  notification-service:
    build: ./notification-service
    image: nepalgo/notification-service:local
    container_name: nepalgo-notification-service
    profiles: ["app"]
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/nepalgo
      DB_USERNAME: notification_svc
      DB_PASSWORD: ${NOTIFICATION_SVC_DB_PASSWORD:-notification_dev_pw}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: "NepalGo <no-reply@nepalgo.local>"
      OPS_ALERT_EMAIL: ops@nepalgo.local
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/firebase-service-account.json
    volumes: [ "./secrets:/app/secrets:ro" ]
    depends_on: [ postgres, eureka-server, mailpit ]
    mem_limit: 420m
    networks: [ nepalgo-net ]

  support-service:
    build: ./support-service
    image: nepalgo/support-service:local
    container_name: nepalgo-support-service
    profiles: ["app"]
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/nepalgo
      DB_USERNAME: support_svc
      DB_PASSWORD: ${SUPPORT_SVC_DB_PASSWORD:-support_dev_pw}
    volumes: [ "./secrets:/app/secrets:ro" ]
    depends_on: [ postgres, eureka-server ]
    mem_limit: 420m
    networks: [ nepalgo-net ]

  admin-frontend:
    build: ./admin-frontend
    image: nepalgo/admin-frontend:local
    container_name: nepalgo-admin-frontend
    profiles: ["app"]
    depends_on: [ api-gateway ]
    mem_limit: 64m
    ports: [ "8090:80" ]
    networks: [ nepalgo-net ]

volumes:
  nepalgo-pgdata:
  nepalgo-pgadmin-data:
  nepalgo-rustfs-data:

networks:
  nepalgo-net: