server:
  port: 8084

spring:
  application:
    name: payment-service
  config:
    # Pulls in the feature-flag file as its own, clearly named config source
    # (spec section 20), kept out of application.yaml so flags are easy to find.
    import: classpath:feature-flags.yml
  datasource:
    url: jdbc:postgresql://localhost:5433/nepalgo
    username: payment_svc
    password: payment_dev_pw
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: payment
    default-schema: payment

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

nepalgo:
  jwt:
    staff:
      public-key-path: ${JWT_STAFF_PUBLIC_KEY_PATH}