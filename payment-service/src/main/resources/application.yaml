server:
  port: 8084

spring:
  application:
    name: payment-service
  config:
    # Pulls in the feature-flag file as its own, clearly named config source
    # (spec section 20), kept out of application.yaml so flags are easy to find.
    import: classpath:feature-flags.yml
  datasource:
    url: jdbc:postgresql://localhost:5433/nepalgo
    username: payment_svc
    password: payment_dev_pw
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: payment
    default-schema: payment
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

nepalgo:
  jwt:
    staff:
      public-key-path: ${JWT_STAFF_PUBLIC_KEY_PATH}
    customer:
      public-key-path: ${JWT_CUSTOMER_PUBLIC_KEY_PATH}
  storage:
    endpoint: http://localhost:9000
    access-key: ${RUSTFS_ACCESS_KEY}
    secret-key: ${RUSTFS_SECRET_KEY}
    receipts-bucket: payment-receipts      # PRIVATE: no bucket policy, presigned links only
  internal:
    # Shared secret for /internal/** service-to-service calls (header X-Internal-Api-Key).
    # The fallback is a LOCAL-DEV-ONLY value so the stack runs without extra setup;
    # Phase 9 (deployment) must set INTERNAL_API_KEY and remove this fallback.
    api-key: ${INTERNAL_API_KEY:nepalgo-local-dev-internal-key}