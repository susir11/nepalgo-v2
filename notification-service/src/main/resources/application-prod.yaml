# PRODUCTION profile — activate with SPRING_PROFILES_ACTIVE=prod.
# Every value comes from the environment and has NO default: a missing secret
# stops the service at startup ("fail fast") instead of silently falling back
# to a local-dev value. See RUNBOOK.md for the full variable list.
spring:
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME:}       # optional for relays that use IP allow-listing
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: true
  datasource:
    url: ${DB_URL}                 # e.g. jdbc:postgresql://<managed-pg-host>:5432/nepalgo?sslmode=require
    username: ${DB_USERNAME}       # this service's own role (one schema + role per service)
    password: ${DB_PASSWORD}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true

management:
  endpoint:
    health:
      probes:
        enabled: true              # /actuator/health/liveness + /readiness for the container platform
      show-details: never

logging:
  structured:
    format:
      console: ecs                 # one JSON line per log event -> searchable in any log platform

nepalgo:
  internal:
    api-key: ${INTERNAL_API_KEY}   # shared service-to-service secret (no dev fallback in prod)
  jwt:
    staff:
      public-key-path: ${JWT_STAFF_PUBLIC_KEY_PATH}
    customer:
      public-key-path: ${JWT_CUSTOMER_PUBLIC_KEY_PATH}
  notification:
    mail-from: ${MAIL_FROM}
    ops-email: ${OPS_ALERT_EMAIL}
    firebase-credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS}
