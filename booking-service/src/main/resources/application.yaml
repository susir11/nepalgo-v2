server:
  port: 8083

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5433/nepalgo
    username: booking_svc
    password: booking_dev_pw
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: booking
    default-schema: booking

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

nepalgo:
  jwt:
    customer:
      public-key-path: ${JWT_CUSTOMER_PUBLIC_KEY_PATH}
    staff:
      public-key-path: ${JWT_STAFF_PUBLIC_KEY_PATH}

  booking:
    payment-window-hours: 48