server:
  port: 8083

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5433/nepalgo
    username: booking_svc
    password: booking_dev_pw
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: booking
    default-schema: booking
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

eureka:
  client:
    # Fresh service list every 5 s (default 30 s) + load-balancer cache 5 s (default 35 s):
    # after a service restarts, callers find it within seconds instead of failing
    # closed for up to a minute. Negligible extra load on Eureka at this scale.
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

nepalgo:
  jwt:
    customer:
      public-key-path: ${JWT_CUSTOMER_PUBLIC_KEY_PATH}
    staff:
      public-key-path: ${JWT_STAFF_PUBLIC_KEY_PATH}

  # payment window: Billing Settings in payment-service (admin > Billing), not here.

  flags:
    # Spec 20 registry: dormant capability, built but OFF.
    document-upload-enabled: false

  internal:
    # Shared secret for /internal/** service-to-service calls. LOCAL-DEV fallback
    # only; Phase 9 must set INTERNAL_API_KEY and remove the fallback.
    api-key: ${INTERNAL_API_KEY:nepalgo-local-dev-internal-key}