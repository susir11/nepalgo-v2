server:
  port: 8087

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
  application:
    name: support-service
  datasource:
    url: jdbc:postgresql://localhost:5433/nepalgo
    username: support_svc
    password: support_dev_pw
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: support
    default-schema: support

eureka:
  client:
    # Fresh service list every 5 s (default 30 s) + load-balancer cache 5 s (default 35 s):
    # after a service restarts, callers find it within seconds instead of failing
    # closed for up to a minute. Negligible extra load on Eureka at this scale.
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

nepalgo:
  jwt:
    staff:
      public-key-path: ${JWT_STAFF_PUBLIC_KEY_PATH:secrets/staff-public.pem}
    customer:
      public-key-path: ${JWT_CUSTOMER_PUBLIC_KEY_PATH:secrets/customer-public.pem}
  internal:
    api-key: ${INTERNAL_API_KEY:nepalgo-local-dev-internal-key}
  flags:
    # Spec 20: in_app_support_chat_enabled — OFF. Fully built and tested; while
    # OFF every chat/callback route answers 404 (unreachable, not just hidden).
    in-app-support-chat-enabled: ${IN_APP_SUPPORT_CHAT_ENABLED:false}
